<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro inicial | VetCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-screen">
    <section class="login-card register-card">
      <div class="brand-mark">✚</div>
      <p class="eyebrow">CONFIGURAÇÃO INICIAL</p>
      <h1>Criar primeiro acesso</h1>
      <p class="muted">Cadastre os dados do responsável e crie o primeiro usuário administrador do VetCare.</p>
      <form id="registerForm">
        <div class="register-grid">
          <label class="wide">Nome completo<input name="nome" required maxlength="100" autocomplete="name" placeholder="Nome do responsável"></label>
          <label>CPF<input name="cpf" required maxlength="14" placeholder="000.000.000-00"></label>
          <label>Telefone<input name="telefone" maxlength="20" placeholder="(00) 00000-0000"></label>
          <label>E-mail<input name="email" type="email" maxlength="100" autocomplete="email" placeholder="voce@email.com"></label>
          <label>Cargo<select name="cargo" required><option value="">Selecione...</option><option>Administrador</option><option>Gerente</option><option>Veterinário</option><option>Vendedor</option><option>Financeiro</option><option>Atendente</option></select></label>
          <label class="wide">Endereço<input name="endereco" maxlength="200" placeholder="Rua, número, bairro e cidade"></label>
          <label>Login<input name="login" required maxlength="50" autocomplete="username" placeholder="Crie seu usuário"></label>
          <label>Senha<input name="senha" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label>
        </div>
        <p id="registerError" class="error" role="alert"></p>
        <p id="registerSuccess" class="muted" role="status"></p>
        <div class="register-actions">
          <button class="btn primary full" type="submit">Criar primeiro acesso</button>
          <a class="text-link" href="index.html">Voltar ao login</a>
        </div>
      </form>
      <small>Por segurança, esta página só permite criar a primeira conta. Depois disso, novos usuários devem ser cadastrados por um administrador.</small>
    </section>
  </main>
  <script src="js/cadastro.js"></script>
</body>
</html>
